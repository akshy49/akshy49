<title id="t">Tech Stack</title><desc id="d">Frontend: React, JavaScript, HTML, CSS, Tailwind CSS. Backend: Node.js, Express, Python, FastAPI. Database and cloud: MongoDB, Firebase. AI/ML: TensorFlow, Python. Tools: Git, GitHub, VS Code, Vercel.</desc>
